name: Build TWRP itel L6006
on:
  workflow_dispatch:
    inputs:
      stock_recovery_drive_id:
        description: "Google Drive file ID of the stock recovery.img"
        required: true
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Unpack device tree archive
        run: unzip -q twrp-itel-L6006.zip -d src && ls src/twrp-itel-L6006
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean; df -h /
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 libncurses5 lib32ncurses-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python3 python-is-python3 python3-pip lz4 cpio ccache
          pip install gdown
          git config --global user.email "ci@example.com"; git config --global user.name "ci"
      - name: Sync TWRP sources (twrp-11 minimal manifest)
        run: |
          mkdir -p ~/bin ~/twrp
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo; chmod +x ~/bin/repo
          cd ~/twrp
          ~/bin/repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-11
          ~/bin/repo sync -c -j8 --force-sync --no-clone-bundle --no-tags
      - name: Get stock kernel/dtb from your recovery.img
        env:
          FILE_ID: ${{ inputs.stock_recovery_drive_id }}
        run: |
          mkdir -p stock
          gdown "https://drive.google.com/uc?id=${FILE_ID}" -O stock/recovery.img
          git clone --depth=1 https://android.googlesource.com/platform/system/tools/mkbootimg ~/mkbootimg
          python3 ~/mkbootimg/unpack_bootimg.py --boot_img stock/recovery.img --out stock/out
          ls -l stock/out
          D=~/twrp/device/itel/L6006
          mkdir -p $D; cp -r src/twrp-itel-L6006/device/itel/L6006/. $D/
          cp stock/out/kernel $D/prebuilt/kernel
      - name: Build
        run: |
          cd ~/twrp
          export ALLOW_MISSING_DEPENDENCIES=true LC_ALL=C
          source build/envsetup.sh
          lunch twrp_L6006-eng
          mka recoveryimage -j$(nproc)
      - name: Repack with stock kernel header, dtb and dtbo
        run: |
          mkdir -p result
          RD=$(ls ~/twrp/out/target/product/L6006/ramdisk-recovery.* | head -1)
          src/twrp-itel-L6006/scripts/repack.sh stock/out "$RD" ~/mkbootimg/mkbootimg.py result/twrp-itel-L6006.img
          python3 src/twrp-itel-L6006/scripts/make_vbmeta_disabled.py result/vbmeta_disabled.img
      - uses: actions/upload-artifact@v4
        with:
          name: twrp-itel-L6006
          path: result/*
