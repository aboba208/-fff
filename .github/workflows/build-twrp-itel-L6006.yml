name: Build TWRP itel L6006
on:
  workflow_dispatch:
    inputs:
      stock_recovery_drive_id:
        description: "Google Drive file ID of the stock recovery.img"
        required: true
        default: "1wjjWCs0dG8CDw3swXl0RM6inzPl9kPQb"
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: 1. Download stock recovery.img (fail fast)
        env:
          FILE_ID: ${{ inputs.stock_recovery_drive_id }}
        run: |
          set -euo pipefail
          mkdir -p stock logs
          pip install --quiet gdown
          is_img() { [ -s "$1" ] && [ "$(head -c 8 "$1")" = "ANDROID!" ]; }
          ok=0
          for i in 1 2 3; do
            rm -f stock/recovery.img
            gdown "https://drive.google.com/uc?id=${FILE_ID}" -O stock/recovery.img || true
            if ! is_img stock/recovery.img; then
              curl -fsSL -o stock/recovery.img "https://drive.usercontent.google.com/download?id=${FILE_ID}&export=download&confirm=t" || true
            fi
            if is_img stock/recovery.img; then ok=1; break; fi
            echo "attempt $i failed, retrying"; sleep 10
          done
          if [ "$ok" != 1 ]; then
            echo "::error::Could not download recovery.img from Google Drive. Open the file in Drive -> Share -> General access -> 'Anyone with the link' (Viewer), then run the workflow again."
            exit 1
          fi
          ls -l stock/recovery.img
          for u in https://android.googlesource.com/platform/system/tools/mkbootimg https://github.com/aosp-mirror/platform_system_tools_mkbootimg.git; do
            git clone --depth=1 "$u" "$HOME/mkbootimg" && break || true
          done
          test -f "$HOME/mkbootimg/unpack_bootimg.py" || { echo "::error::mkbootimg tools not available"; exit 1; }
          python3 "$HOME/mkbootimg/unpack_bootimg.py" --boot_img stock/recovery.img --out stock/out | tee logs/stock_header.txt
          ls -l stock/out
          test -s stock/out/kernel
      - name: 2. Free disk space and install dependencies
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          sudo apt-get clean
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 libncurses5 lib32ncurses-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python3 python-is-python3 python3-pip lz4 cpio file rsync ccache
          git config --global user.email "ci@example.com"
          git config --global user.name "ci"
          git config --global color.ui false
          df -h /
      - name: 3. Write device tree
        run: |
          set -euo pipefail
          DT="$GITHUB_WORKSPACE/dt"
          mkdir -p "$DT/device/itel/L6006/prebuilt"
          cat > "$DT/device/itel/L6006/AndroidProducts.mk" <<'EOF_0'
          PRODUCT_MAKEFILES := $(LOCAL_DIR)/twrp_L6006.mk
          COMMON_LUNCH_CHOICES := twrp_L6006-eng twrp_L6006-userdebug
          EOF_0
          cat > "$DT/device/itel/L6006/twrp_L6006.mk" <<'EOF_1'
          $(call inherit-product, $(SRC_TARGET_DIR)/product/base.mk)
          $(call inherit-product, vendor/twrp/config/common.mk)
          $(call inherit-product, device/itel/L6006/device.mk)

          PRODUCT_DEVICE := L6006
          PRODUCT_NAME := twrp_L6006
          PRODUCT_BRAND := itel
          PRODUCT_MODEL := itel L6006
          PRODUCT_MANUFACTURER := ITEL MOBILE LIMITED
          EOF_1
          cat > "$DT/device/itel/L6006/device.mk" <<'EOF_2'
          PRODUCT_USE_DYNAMIC_PARTITIONS := true
          EOF_2
          cat > "$DT/device/itel/L6006/BoardConfig.mk" <<'EOF_3'
          DEVICE_PATH := device/itel/L6006
          ALLOW_MISSING_DEPENDENCIES := true

          # Arch: 32-bit ARM (Unisoc SC9832E, Android 10 Go)
          TARGET_ARCH := arm
          TARGET_ARCH_VARIANT := armv7-a-neon
          TARGET_CPU_ABI := armeabi-v7a
          TARGET_CPU_ABI2 := armeabi
          TARGET_CPU_VARIANT := cortex-a53
          TARGET_CPU_SMP := true
          TARGET_BOARD_PLATFORM := sp9832e
          TARGET_BOOTLOADER_BOARD_NAME := sp9832e_1h10_go
          TARGET_NO_BOOTLOADER := true

          # Kernel: prebuilt from stock recovery. Final image is repacked (header v2 + dtb + dtbo) by scripts/repack.sh
          TARGET_PREBUILT_KERNEL := $(DEVICE_PATH)/prebuilt/kernel
          BOARD_KERNEL_CMDLINE := console=ttyS1,115200n8 buildvariant=user
          BOARD_KERNEL_PAGESIZE := 2048
          BOARD_BOOTIMG_HEADER_VERSION := 0

          # Partitions
          BOARD_FLASH_BLOCK_SIZE := 262144
          BOARD_RECOVERYIMAGE_PARTITION_SIZE := 36700160
          BOARD_HAS_LARGE_FILESYSTEM := true
          TARGET_USERIMAGES_USE_EXT4 := true
          TARGET_USERIMAGES_USE_F2FS := true
          TARGET_COPY_OUT_VENDOR := vendor
          AB_OTA_UPDATER := false
          BOARD_AVB_ENABLE := false
          TARGET_RECOVERY_FSTAB := $(DEVICE_PATH)/recovery.fstab

          # TWRP
          TW_THEME := portrait_hdpi
          TW_EXTRA_LANGUAGES := true
          TW_DEFAULT_LANGUAGE := ru
          TW_USE_TOOLBOX := true
          TW_INCLUDE_RESETPROP := true
          TW_INCLUDE_REPACKTOOLS := true
          RECOVERY_SDCARD_ON_DATA := true
          BOARD_HAS_NO_SELECT_BUTTON := true
          TW_BRIGHTNESS_PATH := "/sys/class/backlight/sprd_backlight/brightness"
          TW_MAX_BRIGHTNESS := 255
          TW_DEFAULT_BRIGHTNESS := 150
          EOF_3
          cat > "$DT/device/itel/L6006/recovery.fstab" <<'EOF_4'
          # <mount>  <fstype>  <device>  [<device2>]  flags
          # Unisoc SC9832E, Android 10 Go (dynamic partitions, non A/B). Generated from stock recovery.fstab.
          /boot emmc /dev/block/platform/soc/soc:ap-ahb/20600000.sdio/by-name/boot flags=display="Boot";backup=1;flashimg=1
          /recovery emmc /dev/block/platform/soc/soc:ap-ahb/20600000.sdio/by-name/recovery flags=display="Recovery";backup=1;flashimg=1
          /dtbo emmc /dev/block/platform/soc/soc:ap-ahb/20600000.sdio/by-name/dtbo flags=display="Dtbo";backup=1;flashimg=1
          /vbmeta emmc /dev/block/platform/soc/soc:ap-ahb/20600000.sdio/by-name/vbmeta flags=display="Vbmeta";backup=1;flashimg=1
          /vbmeta_system emmc /dev/block/platform/soc/soc:ap-ahb/20600000.sdio/by-name/vbmeta_system flags=display="Vbmeta_system";backup=1;flashimg=1
          /vbmeta_vendor emmc /dev/block/platform/soc/soc:ap-ahb/20600000.sdio/by-name/vbmeta_vendor flags=display="Vbmeta_vendor";backup=1;flashimg=1
          /super emmc /dev/block/platform/soc/soc:ap-ahb/20600000.sdio/by-name/super flags=display="Super";backup=1;flashimg=1
          /misc emmc /dev/block/platform/soc/soc:ap-ahb/20600000.sdio/by-name/misc flags=display="Misc";backup=1;flashimg=1
          /persist emmc /dev/block/platform/soc/soc:ap-ahb/20600000.sdio/by-name/persist flags=display="Persist";backup=1;flashimg=1
          /logo emmc /dev/block/platform/soc/soc:ap-ahb/20600000.sdio/by-name/logo flags=display="Logo";backup=1;flashimg=1
          /fbootlogo emmc /dev/block/platform/soc/soc:ap-ahb/20600000.sdio/by-name/fbootlogo flags=display="Fbootlogo";backup=1;flashimg=1
          /uboot emmc /dev/block/platform/soc/soc:ap-ahb/20600000.sdio/by-name/uboot flags=display="Uboot";backup=1;flashimg=1
          /sml emmc /dev/block/platform/soc/soc:ap-ahb/20600000.sdio/by-name/sml flags=display="Sml";backup=1;flashimg=1
          /trustos emmc /dev/block/platform/soc/soc:ap-ahb/20600000.sdio/by-name/trustos flags=display="Trustos";backup=1;flashimg=1
          /teecfg emmc /dev/block/platform/soc/soc:ap-ahb/20600000.sdio/by-name/teecfg flags=display="Teecfg";backup=1;flashimg=1
          /pm_sys emmc /dev/block/platform/soc/soc:ap-ahb/20600000.sdio/by-name/pm_sys flags=display="Pm_sys";backup=1;flashimg=1
          /ltemodem emmc /dev/block/platform/soc/soc:ap-ahb/20600000.sdio/by-name/l_modem flags=display="Modem(IMEI)";backup=1
          /ltedsp emmc /dev/block/platform/soc/soc:ap-ahb/20600000.sdio/by-name/l_ldsp flags=backup=1;subpartitionof=/ltemodem
          /ltegdsp emmc /dev/block/platform/soc/soc:ap-ahb/20600000.sdio/by-name/l_gdsp flags=backup=1;subpartitionof=/ltemodem
          /ltedeltanv emmc /dev/block/platform/soc/soc:ap-ahb/20600000.sdio/by-name/l_deltanv flags=backup=1;subpartitionof=/ltemodem
          /ltefixnv1 emmc /dev/block/platform/soc/soc:ap-ahb/20600000.sdio/by-name/l_fixnv1 flags=backup=1;subpartitionof=/ltemodem
          /ltefixnv2 emmc /dev/block/platform/soc/soc:ap-ahb/20600000.sdio/by-name/l_fixnv2 flags=backup=1;subpartitionof=/ltemodem
          /lteruntimenv1 emmc /dev/block/platform/soc/soc:ap-ahb/20600000.sdio/by-name/l_runtimenv1 flags=backup=1;subpartitionof=/ltemodem
          /lteruntimenv2 emmc /dev/block/platform/soc/soc:ap-ahb/20600000.sdio/by-name/l_runtimenv2 flags=backup=1;subpartitionof=/ltemodem
          /wcnmodem emmc /dev/block/platform/soc/soc:ap-ahb/20600000.sdio/by-name/wcnmodem flags=backup=1

          # Dynamic partitions (inside super)
          /system ext4 /dev/block/mapper/system flags=display="system";backup=1;wipeingui
          /vendor ext4 /dev/block/mapper/vendor flags=display="vendor";backup=1;wipeingui
          /product ext4 /dev/block/mapper/product flags=display="product";backup=1;wipeingui
          /system_image emmc /dev/block/mapper/system flags=display="system image";backup=1;flashimg=1
          /vendor_image emmc /dev/block/mapper/vendor flags=display="vendor image";backup=1;flashimg=1
          /product_image emmc /dev/block/mapper/product flags=display="product image";backup=1;flashimg=1

          /data f2fs /dev/block/platform/soc/soc:ap-ahb/20600000.sdio/by-name/userdata flags=display="Data";wipeingui;wipeduringfactoryreset;encryptable=footer;length=-16384
          /cache ext4 /dev/block/platform/soc/soc:ap-ahb/20600000.sdio/by-name/cache flags=display="Cache";wipeingui;wipeduringfactoryreset
          /prodnv ext4 /dev/block/platform/soc/soc:ap-ahb/20600000.sdio/by-name/prodnv flags=backup=1;display="prodnv"
          /socko ext4 /dev/block/platform/soc/soc:ap-ahb/20600000.sdio/by-name/socko flags=backup=1;display="socko"
          /external_sd auto /dev/block/platform/soc/soc:ap-ahb/20300000.sdio/mmcblk1p1 /dev/block/mmcblk1 flags=display="MicroSD";storage;wipeingui;removable
          /usb_otg auto /dev/block/sda1 /dev/block/sda flags=display="USB OTG";storage;wipeingui;removable
          EOF_4
          find "$DT" -type f | sort
      - name: Restore TWRP source cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: ~/twrp
          key: twrp11-src-v1
      - name: 4. Sync TWRP sources (twrp-11 minimal manifest, with retries)
        run: |
          set -euo pipefail
          mkdir -p "$HOME/bin" "$HOME/twrp"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          cd "$HOME/twrp"
          for i in 1 2 3; do
            "$HOME/bin/repo" init --depth=1 --no-repo-verify -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-11 < /dev/null && break
            sleep 15
          done
          ok=0
          for i in 1 2 3 4; do
            if "$HOME/bin/repo" sync -c -j6 --force-sync --no-clone-bundle --no-tags --optimized-fetch 2>&1 | tee -a "$GITHUB_WORKSPACE/logs/sync.log"; then ok=1; break; fi
            echo "repo sync attempt $i failed, retrying"; sleep 30
          done
          [ "$ok" = 1 ] || { echo "::error::repo sync failed 4 times"; exit 1; }
          ls
          test -d bootable/recovery || { echo "::error::bootable/recovery missing after sync"; exit 1; }
          du -sh "$HOME/twrp" || true
      - name: Save TWRP source cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/twrp
          key: twrp11-src-v1
      - name: 5. Build recovery ramdisk
        run: |
          set +u
          set -o pipefail
          DT="$GITHUB_WORKSPACE/dt"
          cd "$HOME/twrp"
          mkdir -p device/itel/L6006
          cp -r "$DT/device/itel/L6006/." device/itel/L6006/
          cp "$GITHUB_WORKSPACE/stock/out/kernel" device/itel/L6006/prebuilt/kernel
          export ALLOW_MISSING_DEPENDENCIES=true LC_ALL=C
          set +e +u
          mkdir -p "$GITHUB_WORKSPACE/logs"
          source build/envsetup.sh > "$GITHUB_WORKSPACE/logs/envsetup.log" 2>&1
          tail -n 5 "$GITHUB_WORKSPACE/logs/envsetup.log"
          lunch twrp_L6006-eng 2>&1 | tee "$GITHUB_WORKSPACE/logs/lunch.log"
          if [ "${TARGET_PRODUCT:-}" != "twrp_L6006" ]; then echo "::error::lunch twrp_L6006-eng failed (see lunch.log)"; exit 1; fi
          mka recoveryimage -j"$(nproc)" 2>&1 | tee "$GITHUB_WORKSPACE/logs/build.log"
          rc=${PIPESTATUS[0]}
          OUT="$HOME/twrp/out/target/product/L6006"
          ls -l "$OUT" | head -40
          [ "$rc" = 0 ] || { echo "::error::mka recoveryimage failed (see build.log)"; exit 1; }
          ls "$OUT"/ramdisk-recovery.* > /dev/null 2>&1 || { echo "::error::ramdisk-recovery not produced"; exit 1; }
      - name: 6. Check ramdisk, repack with stock kernel, verify
        run: |
          set -euo pipefail
          OUT="$HOME/twrp/out/target/product/L6006"
          RD=$(ls "$OUT"/ramdisk-recovery.* | head -1)
          echo "ramdisk: $RD"
          rm -rf chk && mkdir chk
          case "$RD" in
            *.cpio) cat "$RD" > chk.cpio ;;
            *) (zcat "$RD" 2>/dev/null || lz4 -dc "$RD") > chk.cpio ;;
          esac
          (cd chk && cpio -idm --quiet < ../chk.cpio)
          BIN=$(find chk -type f -name recovery | head -1)
          test -n "$BIN" || { echo "::error::no recovery binary in ramdisk"; exit 1; }
          file -b "$BIN"
          file -b "$BIN" | grep -q "32-bit" || { echo "::error::recovery binary is not 32-bit"; exit 1; }
          file -b "$BIN" | grep -q "ARM" || { echo "::error::recovery binary is not ARM"; exit 1; }
          case "$RD" in *.cpio) gzip -9 -c "$RD" > rd.gz; RD=rd.gz ;; esac
          S=stock/out
          mkdir -p result
          ARGS=(--header_version 2 --kernel "$S/kernel" --ramdisk "$RD"
            --base 0x00000000 --pagesize 2048 --kernel_offset 0x00008000 --ramdisk_offset 0x05400000
            --second_offset 0x00f00000 --tags_offset 0x00000100 --dtb_offset 0x01715000
            --os_version 10.0.0 --os_patch_level 2020-12
            --cmdline "console=ttyS1,115200n8 buildvariant=user")
          [ -s "$S/dtb" ] && ARGS+=(--dtb "$S/dtb")
          [ -s "$S/recovery_dtbo" ] && ARGS+=(--recovery_dtbo "$S/recovery_dtbo")
          python3 "$HOME/mkbootimg/mkbootimg.py" "${ARGS[@]}" -o result/twrp-itel-L6006.img
          SZ=$(stat -c %s result/twrp-itel-L6006.img)
          echo "image size: $SZ (limit 36700160)"
          [ "$SZ" -le 36700160 ] || { echo "::error::image is bigger than the recovery partition"; exit 1; }
          python3 "$HOME/mkbootimg/unpack_bootimg.py" --boot_img result/twrp-itel-L6006.img --out chk_out | tee logs/result_header.txt
          cmp chk_out/kernel "$S/kernel" || { echo "::error::kernel mismatch"; exit 1; }
          [ ! -s "$S/dtb" ] || cmp chk_out/dtb "$S/dtb"
          python3 - <<'PY'
          import struct
          h=struct.pack(">4sII",b"AVB0",1,0)+struct.pack(">QQ",0,0)+struct.pack(">I",0)+struct.pack(">"+"Q"*10,*[0]*10)+struct.pack(">Q",0)+struct.pack(">I",3)+struct.pack(">I",0)+b"avbtool 1.1.0".ljust(48,b"\0")
          open("result/vbmeta_disabled.img","wb").write(h.ljust(256,b"\0").ljust(4096,b"\0"))
          PY
          ls -l result
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: twrp-itel-L6006
          path: result/*
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            logs/*
          if-no-files-found: ignore
      - name: Failure summary
        if: failure()
        run: |
          {
            echo "## Build failed - last lines of logs"
            for f in logs/envsetup.log logs/lunch.log logs/build.log; do
              if [ -f "$f" ]; then echo "### $f"; echo '```'; tail -n 40 "$f"; echo '```'; fi
            done
          } >> "$GITHUB_STEP_SUMMARY" || true
          exit 0
